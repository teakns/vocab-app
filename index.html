// ---- storage polyfill: window.storage backed by localStorage (per-viewer, this browser only) ----
window.storage = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found: " + key);
      return { key, value: v, shared: false };
    } catch (e) {
      throw e;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    } catch (e) {
      console.error("storage.set failed", e);
      return null;
    }
  },
  async delete(key) {
    try {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    } catch (e) {
      return null;
    }
  },
  async list(prefix) {
    try {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    } catch (e) {
      return null;
    }
  },
};

// ---------- SM-2 spaced repetition ----------
function scheduleNext(progress, quality) {
  // quality: 0 = again, 3 = hard, 4 = good, 5 = easy
  let { repetition, interval, easiness } = progress;
  if (quality < 3) {
    repetition = 0;
    interval = 1;
  } else {
    if (repetition === 0) interval = 1;
    else if (repetition === 1) interval = 6;
    else interval = Math.round(interval * easiness);
    repetition += 1;
  }
  easiness = Math.max(
    1.3,
    easiness + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02))
  );
  const due = new Date();
  due.setDate(due.getDate() + interval);
  due.setHours(0, 0, 0, 0);
  return { repetition, interval, easiness, due: due.getTime() };
}

function todayStamp() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function freshProgress() {
  return { repetition: 0, interval: 0, easiness: 2.5, due: todayStamp() };
}

const LESSONS = LESSON_DATA.map((l) => ({
  id: "l" + l.num,
  num: l.num,
  title: l.title,
  word: l.word.map(([front, back, note], idx) => ({
    id: `l${l.num}-word-${idx}`,
    front,
    back,
    note,
  })),
  sentence: l.sentence.map(([front, back, note], idx) => ({
    id: `l${l.num}-sentence-${idx}`,
    front,
    back,
    note,
  })),
}));

function buildBaseContent() {
  const content = {};
  LESSONS.forEach((l) => {
    content[l.id] = { word: l.word, sentence: l.sentence };
  });
  return content;
}

// ---------- storage ----------
async function loadKey(key) {
  try {
    const res = await window.storage.get(key, false);
    if (res && res.value) return JSON.parse(res.value);
  } catch (e) {
    /* not found yet */
  }
  return null;
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("save failed", key, e);
  }
}

function randId(prefix) {
  return prefix + Math.random().toString(36).slice(2, 9);
}

function VocabApp() {
  const [content, setContent] = useState(null); // { [lessonId]: {word:[], sentence:[]} }
  const [overrides, setOverrides] = useState({});
  const [students, setStudents] = useState(null); // { list:[{id,name}], activeId }
  const [studentData, setStudentData] = useState(null); // { progress:{}, streak:{} }
  const [lessonId, setLessonId] = useState(LESSONS[0].id);
  const [mode, setMode] = useState("word");
  const [flipped, setFlipped] = useState(false);
  const [panel, setPanel] = useState(null); // null | "add" | "manage" | "students"
  const [loaded, setLoaded] = useState(false);

  // initial load: content overrides + students
  useEffect(() => {
    (async () => {
      const ov = (await loadKey("deck-overrides")) || {};
      const base = buildBaseContent();
      Object.keys(ov).forEach((lid) => {
        if (!base[lid]) return;
        if (ov[lid].word) base[lid] = { ...base[lid], word: ov[lid].word };
        if (ov[lid].sentence) base[lid] = { ...base[lid], sentence: ov[lid].sentence };
      });
      setOverrides(ov);
      setContent(base);

      let sm = await loadKey("students-meta");
      if (!sm || !sm.list || sm.list.length === 0) {
        const first = { id: randId("s"), name: "학생1" };
        sm = { list: [first], activeId: first.id };
        await saveKey("students-meta", sm);
      }
      setStudents(sm);
    })();
  }, []);

  // load active student's data whenever activeId changes
  useEffect(() => {
    if (!students || !students.activeId) return;
    (async () => {
      const sd = (await loadKey(`student-data:${students.activeId}`)) || {
        progress: {},
        streak: { count: 0, lastDay: 0 },
      };
      setStudentData(sd);
      setLoaded(true);
    })();
  }, [students?.activeId]);

  const cfg = MODES[mode];
  const lesson = LESSONS.find((l) => l.id === lessonId);

  function mergedCard(card) {
    const p = (studentData && studentData.progress[card.id]) || freshProgress();
    return { ...card, ...p };
  }

  const due = useMemo(() => {
    if (!content || !studentData) return [];
    const today = todayStamp();
    return content[lessonId][mode]
      .map(mergedCard)
      .filter((c) => c.due <= today);
  }, [content, studentData, lessonId, mode]);

  const current = due[0];

  const stats = useMemo(() => {
    if (!content || !studentData) return { learning: 0, mastered: 0, total: 0 };
    const arr = content[lessonId][mode].map(mergedCard);
    const mastered = arr.filter((c) => c.interval >= 21).length;
    return { learning: arr.length - mastered, mastered, total: arr.length };
  }, [content, studentData, lessonId, mode]);

  // due counts per lesson for chip badges (current mode)
  const lessonDueCounts = useMemo(() => {
    if (!content || !studentData) return {};
    const today = todayStamp();
    const out = {};
    LESSONS.forEach((l) => {
      out[l.id] = content[l.id][mode].filter((c) => {
        const p = studentData.progress[c.id] || freshProgress();
        return p.due <= today;
      }).length;
    });
    return out;
  }, [content, studentData, mode]);

  function persistContentOverride(lid, m, newArr) {
    const newContent = { ...content, [lid]: { ...content[lid], [m]: newArr } };
    setContent(newContent);
    const newOverrides = { ...overrides, [lid]: { ...overrides[lid], [m]: newArr } };
    setOverrides(newOverrides);
    saveKey("deck-overrides", newOverrides);
  }

  function persistStudentData(activeId, sd) {
    setStudentData(sd);
    saveKey(`student-data:${activeId}`, sd);
  }

  function rate(quality) {
    if (!current || !students) return;
    const base = studentData.progress[current.id] || freshProgress();
    const updatedProgress = scheduleNext(base, quality);
    const newProgress = { ...studentData.progress, [current.id]: updatedProgress };

    const today = todayStamp();
    let newStreak = studentData.streak;
    if (studentData.streak.lastDay !== today) {
      const yesterday = today - 86400000;
      const nextCount =
        studentData.streak.lastDay === yesterday ? studentData.streak.count + 1 : 1;
      newStreak = { count: nextCount, lastDay: today };
    }

    persistStudentData(students.activeId, { progress: newProgress, streak: newStreak });
    setFlipped(false);
  }

  function addCard(front, back, note) {
    if (!front.trim() || !back.trim()) return;
    const card = {
      id: randId(`${lessonId}-${mode}-`),
      front: front.trim(),
      back: back.trim(),
      note: (note || "").trim(),
    };
    persistContentOverride(lessonId, mode, [...content[lessonId][mode], card]);
  }

  function removeCard(id) {
    persistContentOverride(
      lessonId,
      mode,
      content[lessonId][mode].filter((c) => c.id !== id)
    );
  }

  // ---------- student management ----------
  function persistStudents(newStudents) {
    setStudents(newStudents);
    saveKey("students-meta", newStudents);
  }

  function selectStudent(id) {
    setPanel(null);
    persistStudents({ ...students, activeId: id });
  }

  function addStudent(name) {
    if (!name.trim()) return;
    const s = { id: randId("s"), name: name.trim() };
    persistStudents({ ...students, list: [...students.list, s] });
  }

  function bulkAddStudents(count) {
    const n = Math.max(1, Math.min(100, parseInt(count, 10) || 0));
    if (!n) return;
    const startIdx = students.list.length + 1;
    const newOnes = Array.from({ length: n }, (_, i) => ({
      id: randId("s"),
      name: `학생${startIdx + i}`,
    }));
    persistStudents({ ...students, list: [...students.list, ...newOnes] });
  }

  function renameStudent(id, name) {
    if (!name.trim()) return;
    persistStudents({
      ...students,
      list: students.list.map((s) => (s.id === id ? { ...s, name: name.trim() } : s)),
    });
  }

  function removeStudent(id) {
    if (students.list.length <= 1) return;
    const newList = students.list.filter((s) => s.id !== id);
    const newActive = students.activeId === id ? newList[0].id : students.activeId;
    persistStudents({ list: newList, activeId: newActive });
    try {
      window.storage.delete(`student-data:${id}`, false);
    } catch (e) {}
  }

  if (!loaded || !content || !students || !studentData) {
    return (
      <div style={styles.root}>
        <div style={styles.loading}>불러오는 중…</div>
      </div>
    );
  }

  const activeStudentName =
    students.list.find((s) => s.id === students.activeId)?.name || "";

  return (
    <div style={styles.root}>
      <style>{fontImport}</style>
      <header style={styles.header}>
        <div style={styles.headTop}>
          <div style={styles.brand}>단어장</div>
          <div style={styles.headRight}>
            <div style={styles.streak}>
              <Flame size={14} color="#C98A2B" strokeWidth={2.2} />
              <span>{studentData.streak.count}일 연속</span>
            </div>
            <button style={styles.studentBtn} onClick={() => setPanel("students")}>
              <Users size={13} strokeWidth={2.2} />
              {activeStudentName}
              <ChevronDown size={12} strokeWidth={2.2} />
            </button>
          </div>
        </div>

        <div style={styles.lessonRow}>
          {LESSONS.map((l) => {
            const active = l.id === lessonId;
            const cnt = lessonDueCounts[l.id] || 0;
            return (
              <button
                key={l.id}
                onClick={() => {
                  setLessonId(l.id);
                  setFlipped(false);
                }}
                style={{ ...styles.lessonChip, ...(active ? styles.lessonChipActive : {}) }}
              >
                {l.num}과
                {cnt > 0 && (
                  <span
                    style={{
                      ...styles.lessonChipBadge,
                      ...(active ? styles.lessonChipBadgeActive : {}),
                    }}
                  >
                    {cnt}
                  </span>
                )}
              </button>
            );
          })}
        </div>
        <div style={styles.lessonTitle}>
          {lesson.num}과 · {lesson.title}
        </div>

        <div style={styles.modeTabs}>
          {Object.entries(MODES).map(([key, m]) => {
            const Icon = m.icon;
            const active = key === mode;
            return (
              <button
                key={key}
                onClick={() => {
                  setMode(key);
                  setFlipped(false);
                }}
                style={{ ...styles.modeTab, ...(active ? styles.modeTabActive : {}) }}
              >
                <Icon size={14} strokeWidth={2.2} />
                {m.label}
                <span style={styles.modeTabCount}>
                  {content[lessonId][key].map(mergedCard).filter((c) => c.due <= todayStamp())
                    .length}
                </span>
              </button>
            );
          })}
        </div>

        <div style={styles.statRow}>
          <Stat label="오늘 남음" value={due.length} accent />
          <Stat label="학습중" value={stats.learning} />
          <Stat label="익힘" value={stats.mastered} />
        </div>
      </header>

      <main style={styles.main}>
        {current ? (
          <StudyCard
            card={current}
            cfg={cfg}
            flipped={flipped}
            onFlip={() => setFlipped(true)}
            onRate={rate}
            remaining={due.length}
          />
        ) : (
          <EmptyState
            hasDeck={content[lessonId][mode].length > 0}
            cfg={cfg}
            onAdd={() => setPanel("add")}
          />
        )}
      </main>

      <footer style={styles.footer}>
        <button style={styles.footerBtn} onClick={() => setPanel("add")}>
          <Plus size={15} strokeWidth={2.2} />
          {cfg.label} 추가
        </button>
        <button style={styles.footerBtn} onClick={() => setPanel("manage")}>
          <Library size={15} strokeWidth={2.2} />
          {cfg.label} 목록 ({content[lessonId][mode].length})
        </button>
      </footer>

      {panel === "add" && (
        <AddPanel cfg={cfg} onClose={() => setPanel(null)} onAdd={addCard} />
      )}
      {panel === "manage" && (
        <ManagePanel
          cfg={cfg}
          deck={content[lessonId][mode].map(mergedCard)}
          onClose={() => setPanel(null)}
          onRemove={removeCard}
        />
      )}
      {panel === "students" && (
        <StudentsPanel
          students={students}
          onClose={() => setPanel(null)}
          onSelect={selectStudent}
          onAdd={addStudent}
          onBulkAdd={bulkAddStudents}
          onRename={renameStudent}
          onRemove={removeStudent}
        />
      )}
    </div>
  );
}

      <span style={styles.statLabel}>{label}</span>

  );
}

  return (
    <div style={styles.stage}>
      <div style={styles.cardStackWrap}>
        <div style={{ ...styles.cardGhost, transform: "translate(10px, 10px)", opacity: 0.35 }} />
        <div style={{ ...styles.cardGhost, transform: "translate(5px, 5px)", opacity: 0.55 }} />
        <div style={styles.card} onClick={!flipped ? onFlip : undefined} role="button" tabIndex={0}>
          {!flipped ? (
            <div style={styles.cardFront}>
              <div style={isSentence ? styles.cardSentence : styles.cardWord}>{card.front}</div>
              <div style={styles.cardTapHint}>{cfg.tapHint}</div>

          ) : (
            <div style={styles.cardBack}>
              <div style={isSentence ? styles.cardSentenceSmall : styles.cardWordSmall}>
                {card.front}
              </div>
              <div style={styles.cardMeaning}>{card.back}</div>
              {card.note && <div style={styles.cardExample}>{card.note}</div>}

      {flipped ? (
        <div style={styles.rateRow}>
          <RateBtn label="다시" sub="1분 뒤" onClick={() => onRate(0)} tone="#B5493D" />
          <RateBtn label="어려움" sub="내일" onClick={() => onRate(3)} tone="#C98A2B" />
          <RateBtn label="보통" sub="며칠 뒤" onClick={() => onRate(4)} tone="#3B5D50" />
          <RateBtn label="쉬움" sub="여유롭게" onClick={() => onRate(5)} tone="#4C7A6A" />
        </div>
      ) : (
        <div style={styles.remainingHint}>남은 카드 {remaining}장</div>
      )}
    </div>
  );
}

function AddPanel({ cfg, onClose, onAdd }) {
  const [front, setFront] = useState("");
  const [back, setBack] = useState("");
  const [note, setNote] = useState("");
  const [bulk, setBulk] = useState("");
  const [tab, setTab] = useState("single");

  function submitSingle() {
    onAdd(front, back, note);
    setFront("");
    setBack("");
    setNote("");
  }

  function submitBulk() {
    const lines = bulk.split("\n").map((l) => l.trim()).filter(Boolean);
    lines.forEach((line) => {
      const parts = line.split(",");
      if (parts.length >= 2) {
        onAdd(parts[0], parts[1], parts.slice(2).join(",").trim());
      }
    });
    setBulk("");
  }

  return (
    <div style={styles.overlay} onClick={onClose}>
      <div style={styles.panel} onClick={(e) => e.stopPropagation()}>
        <div style={styles.panelHead}>
          <span style={styles.panelTitle}>{cfg.label} 추가</span>
          <button style={styles.iconBtn} onClick={onClose}>
            <X size={16} />
          </button>
        </div>

        <div style={styles.tabRow}>
          <button
            style={{ ...styles.tabBtn, ...(tab === "single" ? styles.tabBtnActive : {}) }}
            onClick={() => setTab("single")}
          >
            한 개씩
          </button>
          <button
            style={{ ...styles.tabBtn, ...(tab === "bulk" ? styles.tabBtnActive : {}) }}
            onClick={() => setTab("bulk")}
          >
            여러 개 붙여넣기
          </button>
        </div>

        {tab === "single" ? (
          <div style={styles.formCol}>
            <input
              style={styles.input}
              placeholder={`${cfg.frontLabel} (예: ${cfg.frontPlaceholder})`}
              value={front}
              onChange={(e) => setFront(e.target.value)}
            />
            <input
              style={styles.input}
              placeholder={`${cfg.backLabel} (예: ${cfg.backPlaceholder})`}
              value={back}
              onChange={(e) => setBack(e.target.value)}
            />
            <input
              style={styles.input}
              placeholder={cfg.notePlaceholder}
              value={note}
              onChange={(e) => setNote(e.target.value)}
            />
            <button style={styles.primaryBtn} onClick={submitSingle}>
              추가하기
            </button>
          </div>
        ) : (
          <div style={styles.formCol}>
            <div style={styles.bulkHint}>
              한 줄에 하나씩, "{cfg.frontLabel}, {cfg.backLabel}, {cfg.noteLabel}" 순서로
              붙여넣으세요. {cfg.noteLabel}은 생략 가능해요.
            </div>
            <textarea
              style={styles.textarea}
              placeholder={cfg.bulkPlaceholder}
              value={bulk}
              onChange={(e) => setBulk(e.target.value)}
              rows={7}
            />
            <button style={styles.primaryBtn} onClick={submitBulk}>
              모두 추가하기
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function StudentsPanel({ students, onClose, onSelect, onAdd, onBulkAdd, onRename, onRemove }) {
  const [name, setName] = useState("");
  const [count, setCount] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editingName, setEditingName] = useState("");

  return (

            <X size={16} />
          </button>
        </div>

        <div style={styles.listWrap}>
          {students.list.map((s) => {
            const active = s.id === students.activeId;
            const editing = editingId === s.id;
            return (
              <div
                key={s.id}
                style={{
                  ...styles.studentRow,
                  ...(active ? styles.studentRowActive : {}),
                }}
              >
                {editing ? (
                  <input
                    style={styles.studentEditInput}
                    value={editingName}
                    autoFocus
                    onChange={(e) => setEditingName(e.target.value)}
                    onBlur={() => {
                      onRename(s.id, editingName);
                      setEditingId(null);
                    }}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        onRename(s.id, editingName);
                        setEditingId(null);
                      }
                    }}
                  />
                ) : (
                  <button
                    style={styles.studentNameBtn}
                    onClick={() => onSelect(s.id)}
                  >
                    {s.name}
                    {active && <span style={styles.studentActiveTag}>선택됨</span>}
                  </button>
                )}
                <div style={styles.studentRowActions}>
                  <button
                    style={styles.iconBtnSmall}
                    onClick={() => {
                      setEditingId(s.id);
                      setEditingName(s.name);
                    }}
                  >
                    <Pencil size={12} />
                  </button>
                  <button
                    style={styles.iconBtnSmall}
                    onClick={() => onRemove(s.id)}
                    disabled={students.list.length <= 1}
                  >
                    <Trash2 size={12} />
                  </button>
                </div>
              </div>
            );
          })}
        </div>

        <div style={styles.formCol}>
          <div style={styles.bulkHint}>이름으로 한 명 추가</div>
          <div style={{ display: "flex", gap: 6 }}>
            <input
              style={{ ...styles.input, flex: 1 }}
              placeholder="학생 이름"
              value={name}
              onChange={(e) => setName(e.target.value)}
            />
            <button
              style={{ ...styles.primaryBtn, width: 72 }}
              onClick={() => {
                onAdd(name);
                setName("");
              }}
            >
              추가
            </button>
          </div>

          <div style={{ ...styles.bulkHint, marginTop: 8 }}>
            인원 수를 지정해서 한 번에 생성 (학생1, 학생2 …)
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <input
              style={{ ...styles.input, flex: 1 }}
              placeholder="인원 수 (예: 20)"
              value={count}
              onChange={(e) => setCount(e.target.value)}
              inputMode="numeric"
            />
            <button
              style={{ ...styles.primaryBtn, width: 72 }}
              onClick={() => {
                onBulkAdd(count);
                setCount("");
              }}
            >
              생성
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
